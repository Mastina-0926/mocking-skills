<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪卡复习 · 中国文学批评史新编</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;}
body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f6ff;color:#1a202c;line-height:1.6}

.nav{height:44px;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid #d0e4f7;display:flex;align-items:center;padding:0 16px}
.nav a{color:#2b6cb0;text-decoration:none;font-size:13px;font-weight:600}
.nav .title{font-size:13px;color:#5a7a9a;margin-left:12px}
.nav .count{margin-left:auto;font-size:12px;color:#7a9bcb}
.nav .reset-btn{margin-left:8px;font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid #d0e4f7;background:#fff;cursor:pointer;color:#5a7a9a}
.nav .reset-btn:hover{background:#e8f4fd}

.stats{max-width:520px;margin:12px auto 0;padding:0 16px;display:flex;gap:12px;font-size:12px;color:#7a9bcb}
.stat-item{flex:1;text-align:center;padding:6px;background:#fff;border-radius:8px;border:1px solid #d0e4f7}
.stat-item .num{font-weight:700;font-size:16px;color:#2b6cb0}
.stats .bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:4px;background:#d0e4f7}
.stats .bar-fill{height:100%;background:linear-gradient(90deg,#5b9bd5,#2b6cb0);border-radius:2px;transition:width 0.3s}

/* card */
.card-container{display:flex;justify-content:center;align-items:center;flex:1;padding:20px;min-height:calc(100vh - 120px)}
.card-wrap{width:100%;max-width:520px}
.info-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.info-bar span{font-size:11px;padding:2px 8px;border-radius:6px;background:#e8f4fd;color:#2b6cb0}
.info-bar .progress{color:#7a9bcb;background:none}

.card{background:#fff;border-radius:12px;padding:32px 24px;min-height:240px;border:1px solid #d0e4f7;box-shadow:0 2px 12px rgba(74,144,217,0.06);display:flex;flex-direction:column;justify-content:center;position:relative}
.card .side-label{position:absolute;top:10px;right:14px;font-size:10px;color:#a0b8d8;font-weight:600}
.card .q{font-size:17px;font-weight:600;text-align:center;line-height:1.6;margin:16px 0}
.card .a{font-size:14px;color:#3a5a7a;text-align:left;line-height:1.7;margin:12px 0 20px;display:none;}
.card .a.show{display:block}
.card .meta-line{font-size:11px;color:#f6ad55;margin-bottom:12px;text-align:center}

.btn-group{display:flex;gap:8px;justify-content:center;margin-top:16px}
.btn{padding:10px 28px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:opacity 0.15s;font-family:inherit}
.btn:hover{opacity:0.85}
.btn-flip{background:#d0e4f7;color:#2b6cb0}
.btn-good{background:#2b6cb0;color:#fff;display:none}
.btn-ok{background:#ecc94b;color:#fff;display:none}
.btn-bad{background:#c0392b;color:#fff;display:none}
.btn-group.show .btn-good,.btn-group.show .btn-ok,.btn-group.show .btn-bad{display:inline-block}
.btn-group.show .btn-flip{display:none}

.empty-empty{text-align:center;color:#7a9bcb;padding:40px}
.empty-empty h3{font-size:18px;color:#2b6cb0;margin-bottom:8px}
.empty-empty p{font-size:14px}
.empty-empty .num{font-size:36px;font-weight:700;color:#2b6cb0;margin:12px 0}
footer{padding:20px;text-align:center;color:#7a9bcb;font-size:12px;border-top:1px solid #d0e4f7}
  </style>
</head>
<body>

<div class="nav">
  <a href="index.html">← 首页</a>
  <span class="title">闪卡复习</span>
  <div class="count">
    <select id="versionSelect" style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #d0e4f7;background:#fff;font-family:inherit;margin-right:10px">
      <option value="shang">📘 上册·先秦至宋金元</option>
      <option value="xia">📕 下册·明代至清代</option>
    </select>
    <span id="countDisplay">加载中...</span>
  </div>
  <button class="reset-btn" id="resetProgressBtn">重置进度</button>
</div>

<div style="display:flex;flex-direction:column;min-height:calc(100vh - 44px)">
<div class="stats">
  <div class="stat-item"><div class="num" id="statDue">0</div><div>待复习</div></div>
  <div class="stat-item"><div class="num" id="statLearning">0</div><div>学习中</div></div>
  <div class="stat-item"><div class="num" id="statMastered">0</div><div>已掌握</div></div>
  <div class="stat-item"><div class="num" id="statTotal">0</div><div>总卡片</div></div>
</div>
<div class="bar" style="max-width:520px;margin:0 auto"><div class="bar-fill" id="barFill" style="width:0%"></div></div>

<div class="card-container">
<div class="card-wrap" id="cardContainer">

<div class="info-bar" id="infoBar">
  <span id="cardMeta"></span>
  <span class="progress" id="cardProgress"></span>
</div>

<div class="card" id="card">
  <div class="side-label" id="sideLabel">问题</div>
  <div id="cardStars" class="meta-line"></div>
  <div class="q" id="question">点击下方按钮开始复习</div>
  <div class="a" id="answer"></div>
  <div class="btn-group" id="btnGroup">
    <button class="btn btn-flip" id="btnFlip">翻转看答案</button>
    <button class="btn btn-good" id="btnGood">✓ 记得</button>
    <button class="btn btn-ok" id="btnOk">△ 模糊</button>
    <button class="btn btn-bad" id="btnBad">✗ 忘记</button>
  </div>
</div>

</div>
</div>
</div>

<script>
(function(){
var STORAGE_KEY = 'criticism_flashcard_progress_v1';
var STORAGE_KEY_SUFFIX = '_shang'; // per version

// data
var cards = [];
var progress = {};
var currentIndex = -1;
var showingAnswer = false;
var currentVersion = 'shang';

var questionEl = document.getElementById('question');
var answerEl = document.getElementById('answer');
var btnFlip = document.getElementById('btnFlip');
var btnGood = document.getElementById('btnGood');
var btnOk = document.getElementById('btnOk');
var btnBad = document.getElementById('btnBad');
var btnGroup = document.getElementById('btnGroup');
var cardMeta = document.getElementById('cardMeta');
var cardProgress = document.getElementById('cardProgress');
var cardStars = document.getElementById('cardStars');
var sideLabel = document.getElementById('sideLabel');
var countDisplay = document.getElementById('countDisplay');
var resetBtn = document.getElementById('resetProgressBtn');
var versionSelect = document.getElementById('versionSelect');
var statDue = document.getElementById('statDue');
var statLearning = document.getElementById('statLearning');
var statMastered = document.getElementById('statMastered');
var statTotal = document.getElementById('statTotal');
var barFill = document.getElementById('barFill');
var cardContainer = document.getElementById('cardContainer');

// load data
function loadCards(version){
  var file = version === 'shang' ? 'assets/flashcards-shang.json' : 'assets/flashcards.json';
  currentVersion = version;
  STORAGE_KEY = 'criticism_flashcard_progress_v1' + (version === 'shang' ? '_shang' : '_xia');
  fetch(file).then(function(r){return r.json();}).then(function(data){
    cards = data;
    loadProgress();
    showCard();
    updateStats();
  });
}

loadCards('shang');

versionSelect.onchange = function(){
  loadCards(versionSelect.value);
};

function loadProgress(){
  try{
    var saved = localStorage.getItem(STORAGE_KEY);
    if(saved){
      progress = JSON.parse(saved);
      // clean up deleted cards
      Object.keys(progress).forEach(function(id){
        if(!cards.find(function(c){return c.id === id;})){
          delete progress[id];
        }
      });
    }
  }catch(e){progress={};}
}

function saveProgress(){
  try{localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));}catch(e){}
}

function getDueCards(){
  var now = Date.now();
  return cards.filter(function(c){
    var p = progress[c.id];
    if(!p) return true; // new card
    return p.nextReview <= now && p.status !== 'mastered';
  });
}

function getLearningCards(){
  return cards.filter(function(c){
    var p = progress[c.id];
    return p && p.status === 'learning';
  });
}

function getMasteredCards(){
  return cards.filter(function(c){
    var p = progress[c.id];
    return p && p.status === 'mastered';
  });
}

function updateStats(){
  var due = getDueCards().length;
  var learning = getLearningCards().length;
  var mastered = getMasteredCards().length;
  var total = cards.length;
  statDue.textContent = due;
  statLearning.textContent = learning;
  statMastered.textContent = mastered;
  statTotal.textContent = total;
  var pct = total > 0 ? Math.round(mastered/total*100) : 0;
  barFill.style.width = pct + '%';
}

function showCard(){
  var due = getDueCards();
  if(due.length === 0){
    cardContainer.innerHTML = 
      '<div class="empty-empty">'
      + '<div class="num">🎉</div>'
      + '<h3>全部卡片已掌握！</h3>'
      + '<p>你已经完成了所有卡片的复习。明天再来巩固吧。</p>'
      + '<p style="margin-top:12px;font-size:12px;color:#7a7a7a">已掌握 ' + getMasteredCards().length + '/' + cards.length + ' 张</p>'
      + '</div>';
    countDisplay.textContent = '全部完成';
    return;
  }else{
    // pick the card with earliest nextReview
    due.sort(function(a,b){
      var pa = progress[a.id];
      var pb = progress[b.id];
      var ta = pa ? pa.nextReview : 0;
      var tb = pb ? pb.nextReview : 0;
      return ta - tb;
    });
    currentIndex = cards.indexOf(due[0]);
    countDisplay.textContent = (cards.length - due.length + 1) + '/' + cards.length;
  }

  var card = cards[currentIndex];
  questionEl.textContent = card.question;
  answerEl.textContent = card.answer;
  answerEl.classList.remove('show');
  showingAnswer = false;
  sideLabel.textContent = '问题';
  btnGroup.classList.remove('show');

  var stars = '★'.repeat(card.stars) + '☆'.repeat(3-card.stars);
  cardStars.textContent = (card.era||'') + ' · ' + (card.school||'') + ' · ' + stars;
  cardMeta.textContent = stars + ' · ' + (card.era||'');
  cardProgress.textContent = (getMasteredCards().length+1) + '/' + cards.length;

  var p = progress[card.id];
  if(!p){
    // new card
  }
}

btnFlip.onclick = function(){
  if(currentIndex < 0 || currentIndex >= cards.length) return;
  showingAnswer = true;
  sideLabel.textContent = '答案';
  answerEl.classList.add('show');
  btnGroup.classList.add('show');
};

function handleRating(rating){
  if(currentIndex < 0 || currentIndex >= cards.length) return;
  var card = cards[currentIndex];
  var p = progress[card.id] || {status:'new', interval:1, nextReview:0, ease:2.5};
  var now = Date.now();

  if(rating === 'good'){
    if(p.status === 'new' || p.status === 'learning'){
      p.interval = p.interval * 2;
      p.status = 'learning';
    }else{
      p.interval = Math.round(p.interval * p.ease);
    }
    p.ease = Math.min(3.0, p.ease + 0.15);
    p.nextReview = now + p.interval * 24 * 60 * 60 * 1000;
    if(p.interval >= 21){
      p.status = 'mastered';
    }
  }else if(rating === 'ok'){
    p.interval = Math.max(1, Math.round(p.interval * 0.5));
    p.ease = Math.max(1.3, p.ease - 0.2);
    p.status = 'learning';
    p.nextReview = now + p.interval * 24 * 60 * 60 * 1000;
  }else if(rating === 'bad'){
    p.interval = 1;
    p.ease = Math.max(1.3, p.ease - 0.3);
    p.status = 'learning';
    p.nextReview = now + 60 * 60 * 1000; // 1 hour
  }

  progress[card.id] = p;
  saveProgress();
  updateStats();
  showCard();
}

btnGood.onclick = function(){handleRating('good');};
btnOk.onclick = function(){handleRating('ok');};
btnBad.onclick = function(){handleRating('bad');};

resetBtn.onclick = function(){
  if(confirm('确定要重置所有学习进度吗？')){
    progress = {};
    saveProgress();
    updateStats();
    showCard();
  }
};

})();
</script>
</body>
</html>
