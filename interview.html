<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>面试模拟 · 中国文学批评史新编</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:#f0f6ff;color:#1a202c;line-height:1.6}

.nav{height:44px;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid #d0e4f7;display:flex;align-items:center;padding:0 16px}
.nav a{color:#2b6cb0;text-decoration:none;font-size:13px;font-weight:600}
.nav .title{font-size:13px;color:#5a7a9a;margin-left:12px}
.nav .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.nav .qnum{font-size:12px;color:#7a9bcb}

.container{max-width:640px;margin:0 auto;padding:20px 16px}

/* question card */
.qcard{background:#fff;border-radius:12px;border:1px solid #d0e4f7;box-shadow:0 2px 12px rgba(74,144,217,0.06);overflow:hidden}
.qheader{padding:10px 16px;background:#e8f4fd;border-bottom:1px solid #d0e4f7;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.qheader .mode{padding:2px 8px;border-radius:6px;background:#fff;color:#2b6cb0;font-weight:600;border:1px solid #d0e4f7}
.qbody{padding:24px 20px}
.qbody .question{font-size:17px;font-weight:600;line-height:1.6;text-align:center}

/* controls */
.controls{display:flex;gap:8px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.ctrl-btn{padding:8px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
.ctrl-btn:hover{opacity:0.85}
.ctrl-btn:disabled{cursor:default;opacity:0.4}
.ctrl-btn.start{background:#2b6cb0;color:#fff}
.ctrl-btn.start.pause{background:#ecc94b;color:#fff}
.ctrl-btn.skip{background:#d0e4f7;color:#2b6cb0}
.ctrl-btn.framework{background:#fff;color:#2b6cb0;border:1px solid #d0e4f7}

/* framework */
.framework-box{margin-top:16px;background:#e8f4fd;border-radius:8px;padding:16px;border:1px solid #d0e4f7;display:none}
.framework-box.open{display:block}
.framework-box .fw-label{font-size:11px;font-weight:700;color:#2b6cb0;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.05em}
.framework-box .fw-content{font-size:13px;color:#3a5a7a;line-height:1.7}

/* mode select */
.mode-selector{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.mode-btn{padding:6px 16px;border-radius:6px;border:1px solid #d0e4f7;background:#fff;font-size:12px;cursor:pointer;font-family:inherit;color:#5a7a9a}
.mode-btn.active{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
.mode-btn:hover:not(.active){background:#e8f4fd}

/* progress dots */
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.dot{width:8px;height:8px;border-radius:50%;background:#e0ddd5}
.dot.done{background:#4a7c59}
.dot.current{background:#2b6cb0;transform:scale(1.3)}

/* done screen */
.done-screen{text-align:center;padding:40px 20px}
.done-screen h2{font-size:22px;color:#2b6cb0;margin-bottom:8px}
.done-screen p{font-size:14px;color:#7a9bcb;margin-bottom:6px}

/* start screen */
.start-screen{text-align:center;padding:40px 20px}
.start-screen h2{font-size:20px;color:#2b6cb0;margin-bottom:12px}
.start-screen p{font-size:14px;color:#5a7a9a;margin-bottom:6px}
.start-screen .big-btn{margin-top:16px;padding:12px 36px;border-radius:10px;border:none;background:#2b6cb0;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.start-screen .big-btn:hover{opacity:0.9}

/* self rating */
.self-rate{margin-top:18px;background:#fff;border-radius:12px;border:1px solid #d0e4f7;padding:14px 16px;text-align:center}
.rate-label{font-size:13px;color:#5a7a9a;margin-bottom:10px;font-weight:600}
.rate-btns{display:flex;gap:10px;justify-content:center}
.rate-btn{padding:10px 22px;border-radius:10px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
.rate-btn:hover{opacity:0.85}
.rate-good{background:#2b6cb0;color:#fff}
.rate-ok{background:#ecc94b;color:#fff}
.rate-bad{background:#c0392b;color:#fff}

/* group result */
.group-box{margin-top:18px;text-align:left}
.group-row{background:#fff;border-radius:12px;border:1px solid #d0e4f7;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.group-row .group-icon{font-size:22px}
.group-row .group-info{flex:1;min-width:0}
.group-row .group-name{font-size:13px;font-weight:700;margin-bottom:4px}
.group-row .group-list{font-size:11px;color:#7a9bcb;line-height:1.6;max-height:80px;overflow-y:auto;word-break:break-all}
.group-row .group-list:empty::after{content:'（暂无）';color:#c0d4e8}
.group-mastered .group-name{color:#2b6cb0}
.group-ok .group-name{color:#b7791f}
.group-bad .group-name{color:#c0392b}
.group-btn{padding:8px 16px;border-radius:8px;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;background:#d0e4f7;color:#2b6cb0;white-space:nowrap}
.group-btn:hover{opacity:0.85}

@media(max-width:640px){.qbody .question{font-size:15px}.qbody{padding:20px 16px}}
</style>
</head>
<body>

<div class="nav">
  <a href="index.html">← 首页</a>
  <span class="title">面试模拟</span>
  <div class="right">
    <select id="versionSelect" style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid #d0e4f7;background:#fff;font-family:inherit;margin-right:8px">
      <option value="shang">📘 上册·先秦至宋金元</option>
      <option value="xia">📕 下册·明代至清代</option>
    </select>
    <span class="qnum" id="qNum">0/0</span>
  </div>
</div>

<div class="container" id="app">
  <!-- start screen -->
  <div id="startScreen">
    <div class="start-screen">
      <h2>🎤 面试模拟训练</h2>
      <p id="startDesc">38道预测题，覆盖上册全部考点</p>
      <p style="font-size:12px;color:#7a9bcb">回答后自评掌握程度 → 一轮结束自动分组 → 针对薄弱题重新考你</p>
      <button class="big-btn" id="startBtn">开始模拟面试</button>
    </div>
  </div>

  <!-- question area -->
  <div id="questionArea" style="display:none">
    <div class="dots" id="dotsContainer"></div>

    <div class="qcard">
      <div class="qheader">
        <span class="mode" id="modeLabel">结构化面试</span>
        <span id="qInfo"></span>
      </div>
      <div class="qbody">
        <div class="question" id="questionText"></div>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn skip" id="skipBtn">下一题</button>
      <button class="ctrl-btn framework" id="fwBtn">查看答题框架</button>
    </div>

    <div class="framework-box" id="fwBox">
      <div class="fw-label">答题框架</div>
      <div class="fw-content" id="fwContent"></div>
    </div>

    <div class="self-rate" id="selfRate">
      <div class="rate-label">这道题你掌握得怎么样？</div>
      <div class="rate-btns">
        <button class="rate-btn rate-good" id="rateGood">✓ 掌握</button>
        <button class="rate-btn rate-ok" id="rateOk">△ 模糊</button>
        <button class="rate-btn rate-bad" id="rateBad">✗ 忘记</button>
      </div>
    </div>
  </div>

  <!-- round result / group screen -->
  <div id="resultScreen" style="display:none">
    <div class="start-screen">
      <h2>📊 本轮完成！</h2>
      <p id="roundSummary">你已经完成了本轮的面试练习。</p>

      <div class="group-box" id="groupBox">
        <div class="group-row group-mastered">
          <div class="group-icon">✅</div>
          <div class="group-info">
            <div class="group-name">掌握的题目</div>
            <div class="group-list" id="groupMasteredList"></div>
          </div>
          <button class="group-btn" data-group="mastered">重考这组</button>
        </div>
        <div class="group-row group-ok">
          <div class="group-icon">🔶</div>
          <div class="group-info">
            <div class="group-name">模糊的题目</div>
            <div class="group-list" id="groupOkList"></div>
          </div>
          <button class="group-btn" data-group="ok">重考这组</button>
        </div>
        <div class="group-row group-bad">
          <div class="group-icon">🔴</div>
          <div class="group-info">
            <div class="group-name">忘记的题目</div>
            <div class="group-list" id="groupBadList"></div>
          </div>
          <button class="group-btn" data-group="bad">重考这组</button>
        </div>
      </div>

      <button class="big-btn" id="restartBtn" style="margin-top:20px;padding:12px 36px;border-radius:10px;border:none;background:#2b6cb0;color:#fff;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit">重新开始完整一轮</button>
    </div>
  </div>
</div>

<script>
(function(){
var questions = [];
var currentIdx = 0;
var currentQueue = []; // 当前这一轮的题目顺序（可能是完整一轮，也可能是某一组的重考）
var ratings = {}; // question.id -> 'good'|'ok'|'bad'

var startScreen = document.getElementById('startScreen');
var questionArea = document.getElementById('questionArea');
var resultScreen = document.getElementById('resultScreen');
var questionText = document.getElementById('questionText');
var skipBtn = document.getElementById('skipBtn');
var fwBtn = document.getElementById('fwBtn');
var fwBox = document.getElementById('fwBox');
var fwContent = document.getElementById('fwContent');
var dotsContainer = document.getElementById('dotsContainer');
var qNum = document.getElementById('qNum');
var qInfo = document.getElementById('qInfo');
var startBtn = document.getElementById('startBtn');
var restartBtn = document.getElementById('restartBtn');
var versionSelect = document.getElementById('versionSelect');
var startDesc = document.getElementById('startDesc');
var selfRate = document.getElementById('selfRate');
var rateGood = document.getElementById('rateGood');
var rateOk = document.getElementById('rateOk');
var rateBad = document.getElementById('rateBad');
var roundSummary = document.getElementById('roundSummary');
var groupMasteredList = document.getElementById('groupMasteredList');
var groupOkList = document.getElementById('groupOkList');
var groupBadList = document.getElementById('groupBadList');

var currentVersion = 'shang';

// load data
function loadQuestions(version){
  var file = version === 'shang' ? 'assets/interviews-shang.json' : 'assets/interviews.json';
  currentVersion = version;
  fetch(file).then(function(r){return r.json();}).then(function(data){
    questions = data;
    startDesc.textContent = data.length + '道预测题，覆盖' + (version === 'shang' ? '上册' : '下册') + '全部考点';
    startBtn.disabled = false;
    startBtn.textContent = '开始模拟面试';
    // reset UI
    currentIdx = 0;
    currentQueue = [];
    ratings = {};
    fwBox.classList.remove('open');
    startScreen.style.display = 'block';
    questionArea.style.display = 'none';
    resultScreen.style.display = 'none';
    qNum.textContent = '0/' + questions.length;
  });
}

loadQuestions('shang');

versionSelect.onchange = function(){
  loadQuestions(versionSelect.value);
};

startBtn.onclick = function(){startFullRound();};
restartBtn.onclick = function(){startFullRound();};

function startFullRound(){
  currentQueue = questions.slice();
  shuffle(currentQueue);
  ratings = {};
  currentIdx = 0;
  fwBox.classList.remove('open');
  startScreen.style.display = 'none';
  resultScreen.style.display = 'none';
  questionArea.style.display = 'block';
  showQuestion();
}

function startGroup(group){
  // 重考某一组：已评过该组评分的那批题目
  var ids = Object.keys(ratings).filter(function(id){
    return ratings[id] === group;
  });
  currentQueue = questions.filter(function(q){ return ids.indexOf(q.id) >= 0; });
  if(currentQueue.length === 0) return;
  shuffle(currentQueue);
  currentIdx = 0;
  fwBox.classList.remove('open');
  resultScreen.style.display = 'none';
  questionArea.style.display = 'block';
  showQuestion();
}

function shuffle(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
}

function showQuestion(){
  if(currentIdx >= currentQueue.length){
    // 本轮结束 → 显示分组结果
    questionArea.style.display = 'none';
    resultScreen.style.display = 'block';
    showGroupResult();
    return;
  }
  var q = currentQueue[currentIdx];
  questionText.textContent = q.question;
  qNum.textContent = (currentIdx+1) + '/' + currentQueue.length;
  qInfo.textContent = '★★★' + ' · ' + (q.era||'') + (ratings[q.id] ? ' · 本轮自评：' + ratingLabel(ratings[q.id]) : '');
  fwContent.textContent = q.framework;
  fwBox.classList.remove('open');
  selfRate.style.display = 'block';

  // dots
  dotsContainer.innerHTML = '';
  currentQueue.forEach(function(_, i){
    var dot = document.createElement('span');
    dot.className = 'dot';
    if(i < currentIdx) dot.classList.add('done');
    if(i === currentIdx) dot.classList.add('current');
    dotsContainer.appendChild(dot);
  });
}

function ratingLabel(r){
  if(r === 'good') return '掌握';
  if(r === 'ok') return '模糊';
  return '忘记';
}

function rate(r){
  var q = currentQueue[currentIdx];
  ratings[q.id] = r;
  currentIdx++;
  showQuestion();
}

rateGood.onclick = function(){rate('good');};
rateOk.onclick = function(){rate('ok');};
rateBad.onclick = function(){rate('bad');};

skipBtn.onclick = function(){
  if(confirm('跳过这道题吗？')){
    currentIdx++;
    showQuestion();
  }
};

fwBtn.onclick = function(){
  fwBox.classList.toggle('open');
};

function showGroupResult(){
  var mastered = [];
  var ok = [];
  var bad = [];
  questions.forEach(function(q){
    if(ratings[q.id] === 'good') mastered.push(q);
    else if(ratings[q.id] === 'ok') ok.push(q);
    else if(ratings[q.id] === 'bad') bad.push(q);
  });
  roundSummary.textContent = '本轮共 ' + questions.length + ' 题 · 掌握 ' + mastered.length + ' 题 · 模糊 ' + ok.length + ' 题 · 忘记 ' + bad.length + ' 题';

  groupMasteredList.textContent = mastered.map(function(q){ return q.question.slice(0, 22) + (q.question.length>22?'…':''); }).join('；');
  groupOkList.textContent = ok.map(function(q){ return q.question.slice(0, 22) + (q.question.length>22?'…':''); }).join('；');
  groupBadList.textContent = bad.map(function(q){ return q.question.slice(0, 22) + (q.question.length>22?'…':''); }).join('；');

  // 绑定重考按钮
  var btns = document.querySelectorAll('.group-btn');
  btns.forEach(function(btn){
    btn.onclick = function(){
      var g = btn.getAttribute('data-group');
      var ids = Object.keys(ratings).filter(function(id){ return ratings[id] === g; });
      if(ids.length === 0){ alert('这组暂时没有题目'); return; }
      startGroup(g);
    };
  });
}

})();
</script>
</body>
</html>
